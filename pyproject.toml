[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-to-video-generator"
version = "2.0.0"
description = "Enterprise-grade YouTube video generator with AI-powered content creation"
authors = [
    {name = "Mustafa Hüseyin Temel, M.D.", email = "mustafatemel@example.com"}
]
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Content Creators",
    "Topic :: Multimedia :: Video",
    "Topic :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["video", "ai", "content-generation", "youtube", "pyqt6"]

dependencies = [
    "PyQt6>=6.6.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "toml>=0.10.2",
    "moviepy>=1.0.3",
    "Pillow>=9.5.0",
    "google-generativeai>=0.8.0",
    "assemblyai>=0.42.0",
    "gtts>=2.5.0",
    "edge-tts>=7.0.0",
    "requests>=2.31.0",
    "Brotli>=1.1.0",
    "psutil>=5.9.0",
    "platformdirs>=4.0.0",
    "babel>=2.12.0",
    "cryptography>=41.0.0",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
]
docs = [
    "Sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
typing = [
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
    "types-Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/Glikomannan/YoutubeToVideo"
Documentation = "https://github.com/Glikomannan/YoutubeToVideo/docs"
Repository = "https://github.com/Glikomannan/YoutubeToVideo"
Issues = "https://github.com/Glikomannan/YoutubeToVideo/issues"

[project.scripts]
youtube-video-generator = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*", "services*", "models*", "data*", "config*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | temp
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as asyncio tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "temp/*",
    "logs/*",
    "assets/*",
    "plugins/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "temp",
    "logs",
    ".venv",
    "venv",
]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["core", "ui", "services", "models", "data", "config"]